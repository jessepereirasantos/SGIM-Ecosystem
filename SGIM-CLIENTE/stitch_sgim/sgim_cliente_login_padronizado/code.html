<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FFC107",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0a0a0a",
                        "surface-dark": "#1a1a1a",
                        "border-dark": "#2d2d2d"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-4">
<!-- Login Container -->
<div class="w-full max-w-[440px] flex flex-col gap-8">
<!-- Logo and Title Section -->
<div class="flex flex-col items-center gap-4">
<div class="bg-primary/10 p-4 rounded-xl border border-primary/20">
<span class="material-symbols-outlined text-primary text-5xl">church</span>
</div>
<div class="text-center">
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold tracking-tight">SGIM Cliente</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Gestão de Igrejas e Membros</p>
</div>
</div>
<!-- Login Card -->
<div class="bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-xl p-8 shadow-xl">
<h2 class="text-xl font-semibold text-slate-900 dark:text-slate-100 mb-6">Acesse sua conta</h2>
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">E-mail corporativo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-background-dark border border-slate-200 dark:border-border-dark rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="exemplo@sgim.com.br" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Senha</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-slate-50 dark:bg-background-dark border border-slate-200 dark:border-border-dark rounded-lg text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-3.5 rounded-lg transition-colors uppercase tracking-wider text-sm mt-2" type="submit">
                    ENTRAR NO SISTEMA
                </button>
</form>
<div class="mt-8 pt-6 border-t border-slate-200 dark:border-border-dark text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Ainda não possui acesso? 
                    <a class="text-primary font-semibold hover:underline" href="#">Solicite acesso</a>
</p>
</div>
</div>
<!-- Footer Info -->
<div class="text-center text-slate-500 dark:text-slate-600 text-xs">
<p>© 2024 SGIM - Sistema de Gestão de Igrejas e Membros</p>
<div class="flex justify-center gap-4 mt-2">
<a class="hover:text-primary transition-colors" href="#">Privacidade</a>
<a class="hover:text-primary transition-colors" href="#">Termos de uso</a>
<a class="hover:text-primary transition-colors" href="#">Suporte</a>
</div>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-20 dark:opacity-10">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/20 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-primary/20 blur-[120px] rounded-full"></div>
</div>
</body></html>
