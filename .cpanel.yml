---
deployment:
  tasks:
    # 1. Limpeza de segurança (Garante que a pasta destino existe)
    - /bin/mkdir -p ~/public_html/downloads

    # 2. Deploy em Bloco (Rápido e Universal usando ~)
    # Copia tudo de SGIM-VENDAS para o seu public_html
    - /bin/cp -rf SGIM-VENDAS/* ~/public_html/
    
    # 3. Deploy do Cliente
    - /bin/cp -f SGIM-CLIENTE/atualizacoes.php ~/public_html/

    # 4. Ajuste de Permissões (Para o ZIP ser baixável)
    - /bin/chmod 755 ~/public_html/downloads
    - /bin/chmod 644 ~/public_html/downloads/sgim_master.zip
