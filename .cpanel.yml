deployment:
  tasks:
    # 1. Copia tudo de VENDAS (Formato original que você prefere)
    - /bin/cp -R SGIM-VENDAS/* /home1/hg9a3205/public_html/
    
    # 2. Garante a pasta de downloads (Seguindo o mesmo formato)
    - /bin/mkdir -p /home1/hg9a3205/public_html/downloads
